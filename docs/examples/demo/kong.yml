_format_version: "3.0"
_transform: true

# Demo topology: named services with distinct latency/status behaviour so the
# SigNoz views show a realistic mix — fast 200s, slow requests, 4xx, 5xx,
# unreachable upstream retries, authenticated consumers.

services:
  - name: payments
    url: http://httpbin:8080/delay/0.05
    routes:
      - name: payments-checkout
        paths: ["/payments"]
        strip_path: true
        plugins:
          - name: key-auth

  - name: orders
    url: http://httpbin:8080/delay/0.15
    routes:
      - name: orders-list
        paths: ["/orders"]
        strip_path: true
        plugins:
          - name: key-auth

  - name: orders-archive
    url: http://httpbin:8080/status/404
    routes:
      - name: orders-archive
        paths: ["/orders/archive"]
        strip_path: true

  - name: auth
    url: http://httpbin:8080/anything/auth
    routes:
      - name: auth-token
        paths: ["/auth"]
        strip_path: true

  - name: inventory
    url: http://httpbin:8080/status/500
    routes:
      - name: inventory-sync
        paths: ["/inventory"]
        strip_path: true

  - name: legacy-erp
    url: http://nowhere.invalid:9999
    routes:
      - name: legacy-erp
        paths: ["/legacy"]
        strip_path: true

consumers:
  - username: acme-mobile
    keyauth_credentials:
      - key: demo-key-mobile
  - username: acme-web
    keyauth_credentials:
      - key: demo-key-web

plugins:
  - name: signoz
    config:
      resource:
        service_name: kong
        deployment_environment: demo
      exporter:
        endpoint: https://ingest.us.staging.signoz.cloud:443
        key: "{vault://env/signoz-ingestion-key}"
      traces:
        enabled: true
        sampling_rate: 1.0
      logs:
        enabled: true
