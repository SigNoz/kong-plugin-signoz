# Demo stack: Kong 3.9 DB-less + plugin source, realistic upstreams and
# traffic, emitting to SigNoz.
#
#   SIGNOZ_INGESTION_KEY=<key> docker compose up -d
services:
  kong:
    image: kong:3.9
    depends_on: [httpbin]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PLUGINS: bundled,signoz
      KONG_LUA_PACKAGE_PATH: /custom/?.lua;/custom/?/init.lua;;
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: notice
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_TRACING_INSTRUMENTATIONS: "all"
      KONG_TRACING_SAMPLING_RATE: "1.0"
      # required for https:// ingestion endpoints — trust the system CA store
      # and allow a full leaf -> intermediate -> root chain
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      KONG_LUA_SSL_VERIFY_DEPTH: "3"
      SIGNOZ_INGESTION_KEY: "${SIGNOZ_INGESTION_KEY:?set SIGNOZ_INGESTION_KEY}"
    volumes:
      - ./kong.yml:/kong/declarative/kong.yml:ro
      - ../../../kong:/custom/kong:ro
    ports:
      - "8000:8000"
      - "8001:8001"

  httpbin:
    image: mccutchen/go-httpbin:2.23.1
    command: ["/bin/go-httpbin", "-port", "8080"]

  traffic:
    image: curlimages/curl:8.10.1
    depends_on: [kong]
    entrypoint: ["/bin/sh", "/traffic.sh"]
    volumes:
      - ./traffic.sh:/traffic.sh:ro
