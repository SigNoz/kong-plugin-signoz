# Local development: Kong DB-less with the plugin source bind-mounted.
# Edits to kong/plugins/signoz/ apply on `docker compose restart kong`.
#
# For a production-style image that installs the published rock instead,
# see the Dockerfile next to this file.
services:
  kong:
    image: kong:3.9
    depends_on: [echo]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PLUGINS: bundled,signoz
      KONG_LUA_PACKAGE_PATH: /custom/?.lua;/custom/?/init.lua;;
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: notice
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_TRACING_INSTRUMENTATIONS: "all"
      KONG_TRACING_SAMPLING_RATE: "1.0"
      # resolved by the {vault://env/signoz-ingestion-key} reference in kong.yml
      SIGNOZ_INGESTION_KEY: "${SIGNOZ_INGESTION_KEY:-}"
    volumes:
      - ./kong.yml:/kong/declarative/kong.yml:ro
      - ../../kong:/custom/kong:ro
    ports:
      - "8000:8000"
      - "8001:8001"

  echo:
    image: mendhak/http-https-echo:34
    environment:
      HTTP_PORT: "8080"
