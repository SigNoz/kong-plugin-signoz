_format_version: "3.0"
_transform: true

services:
  - name: echo
    url: http://echo:8080
    routes:
      - name: echo-route
        paths: ["/echo"]

plugins:
  - name: signoz
    config:
      resource:
        service_name: kong
        deployment_environment: dev
      exporter:
        endpoint: https://ingest.us.staging.signoz.cloud:443
        key: "{vault://env/signoz-ingestion-key}"
      traces:
        enabled: true
        sampling_rate: 1.0
      logs:
        enabled: true
